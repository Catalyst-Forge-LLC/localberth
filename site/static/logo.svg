<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" fill="none" role="img" aria-label="LocalBerth">
	<title>LocalBerth</title>
	<!-- Borderless mark: two slips in perspective, ports painted in the water. -->

	<!-- Harbor water behind the headwalk -->
	<path fill="#2a6f6a" d="M28 8h44l8 10H22z"/>

	<!-- Slip floors -->
	<path fill="#3d8f88" d="M13 67 43.5 67 46.2 19 38.8 19z"/>
	<path fill="#347c76" d="M56.5 67 87 67 61.2 19 53.8 19z"/>
	<!-- ripple -->
	<path stroke="#2f7a74" stroke-width="1.1" opacity="0.55"
		d="M18 52h21M20 58h18M60 50h20M62 56h17"/>

	<!-- Headwalk -->
	<path fill="#1a2433" d="M29 8h42l6.5 11H23.5z"/>
	<path stroke="#3a4a5c" stroke-width="0.9" opacity="0.65" d="M32 12h36M27 16.5h46"/>

	<!-- Dock fingers -->
	<path fill="#1a2433" d="M2 68h13.5L40 17.5h-9.5z"/>
	<path fill="#1a2433" d="M43.2 68h13.6L55.2 17.5h-8.2z"/>
	<path fill="#1a2433" d="M84.5 68H98L69.5 17.5h-8.8z"/>
	<!-- plank ticks, receding -->
	<path stroke="#4a5a6c" stroke-width="0.85" opacity="0.75"
		d="M6 58h7M9 48h7M14 36h7M22 26h7M46 58h8M47 46h7M48 34h6M86 58h8M80 46h8M74 34h7"/>

	<!-- Port numbers on the slip floors -->
	<text x="29" y="50" text-anchor="middle" fill="#f4efe6"
		font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700"
		transform="rotate(-6 29 50)">5173</text>
	<text x="71" y="47" text-anchor="middle" fill="#e4eef0"
		font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.2" font-weight="700"
		transform="rotate(7 71 47)">5174</text>

	<!-- Boat stays in 5173 -->
	<path fill="#f4efe6" stroke="#1a2433" stroke-width="1.2"
		d="M22 54.5c3.4-1.2 8.2-1.4 11.2 0l1.4 7.6c.25 1.4-1 2.5-2.4 2.5H23.2c-1.4 0-2.6-1.1-2.4-2.5z"/>
	<rect x="25.2" y="55.6" width="6.4" height="3.6" rx="0.7" fill="#1a2433" transform="rotate(-5 28.4 57.4)"/>
	<path stroke="#c9a24a" stroke-width="1.25" stroke-linecap="round" d="M24.2 55.2 10.8 48.5"/>
	<circle cx="9.6" cy="47.6" r="1.7" fill="#e8eef4"/>
</svg>
